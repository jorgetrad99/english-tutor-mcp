name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same shape as the compose db-test service; `just check` skips compose when CI=true.
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://tutor:tutor@localhost:5433/tutor_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      # Lint, mypy, all non-eval tests, domain coverage gate and pip-audit.
      - run: uv run just check
