[project]
name = "tutor"
version = "0.1.0"
description = "Persistent, voice-first English tutor exposed as a remote MCP server."
authors = [
    { name = "Jorge", email = "jetradl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "cryptography>=45",
    "fastmcp>=4.0.10,<5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.40,<2.1",
    "tzdata>=2025.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "rust-just>=1.58.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src,tests"
files = ["src", "tests", "evals"]
warn_unused_configs = true
warn_redundant_casts = true

# Section 14: mypy strict on core modules. `strict` is global-only, so list its per-module flags.
[[tool.mypy.overrides]]
module = ["tutor.domain", "tutor.domain.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "unit: fast, no I/O",
    "integration: needs the db-test Postgres (just test-int)",
    "eval: LLM evaluation set; never runs in hooks or just check",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["tutor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = false
