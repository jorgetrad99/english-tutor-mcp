<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script type="application/json" id="tutor-params"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problema</title>
<style>
:root{--bg:var(--color-background,#ffffff);--fg:var(--color-text,#1a1a1a);--muted:#555555;--accent:#1f5fbf;--line:#cccccc}
@media (prefers-color-scheme: dark){:root{--bg:var(--color-background,#16181c);--fg:var(--color-text,#f0f0f0);--muted:#b8b8b8;--accent:#7fb0ff;--line:#444444}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
button{font:inherit;padding:8px 14px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.cue{font-size:1.5rem;font-weight:600;margin:8px 0 16px}
.hint{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1 class="cue" id="problem-label"></h1>
<p id="problem"></p>
<label for="answer" id="answer-label"></label>
<input id="answer" type="text" inputmode="decimal" autocomplete="off">
<p class="hint" id="format"></p>
<p><button type="button" id="check"></button></p>
<div role="status" id="result"></div>
</main>
<script>
(function () {
  // numeric, authored: the server parses the typed text and checks it within the tolerance.
  var TEXT = {
    es: { answer: "Tu resultado", format: "Usa punto o coma decimal, o una fracción como 1/4.", check: "Comprobar", right: "Correcto", wrong: "No es correcto", solution: "Solución" },
    en: { answer: "Your result", format: "Use a decimal point or comma, or a fraction like 1/4.", check: "Check", right: "Right", wrong: "Not right", solution: "Solution" }
  };
  var payload = JSON.parse(document.getElementById("tutor-params").textContent);
  var t = TEXT[payload.ui_lang] || TEXT.es;
  document.getElementById("problem-label").textContent = payload.labels.problem || "";
  document.getElementById("problem").textContent = payload.params.problem || "";
  document.getElementById("answer-label").textContent = t.answer;
  document.getElementById("format").textContent = t.format;
  document.getElementById("check").textContent = t.check;
  var input = document.getElementById("answer");
  var sent = false;
  function send() {
    var value = input.value.trim();
    if (!value || sent) { return; }
    sent = true;
    window.tutorSubmit({ answer_kind: "number", value: value });
  }
  document.getElementById("check").addEventListener("click", send);
  input.addEventListener("keydown", function (event) { if (event.key === "Enter") { send(); } });
  window.tutorOnResult = function (result) {
    var box = document.getElementById("result");
    box.textContent = "";
    var verdict = document.createElement("p");
    verdict.textContent = result.correct ? t.right : t.wrong;
    box.appendChild(verdict);
    if (result.reveal && result.reveal.worked_solution) {
      var title = document.createElement("p");
      title.textContent = t.solution;
      var body = document.createElement("pre");
      body.textContent = result.reveal.worked_solution;
      box.appendChild(title);
      box.appendChild(body);
    }
  };
})();
</script>
</body>
</html>
