<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script type="application/json" id="tutor-params"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabla</title>
<style>
:root{--bg:var(--color-background,#ffffff);--fg:var(--color-text,#1a1a1a);--muted:#555555;--accent:#1f5fbf;--line:#cccccc}
@media (prefers-color-scheme: dark){:root{--bg:var(--color-background,#16181c);--fg:var(--color-text,#f0f0f0);--muted:#b8b8b8;--accent:#7fb0ff;--line:#444444}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
button{font:inherit;padding:8px 14px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.cue{font-size:1.5rem;font-weight:600;margin:8px 0 16px}
.hint{color:var(--muted)}
</style>
<style>
main{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
caption{text-align:left;font-weight:600;padding-bottom:8px}
</style>
</head>
<body>
<main>
<table><caption id="caption"></caption><thead id="head"></thead><tbody id="body"></tbody></table>
</main>
<script>
(function () {
  // A display (grading_kind "none"): the first row of the text_table is the header row.
  // A display never submits an answer.
  var payload = JSON.parse(document.getElementById("tutor-params").textContent);
  var rows = payload.params.table || [];
  document.getElementById("caption").textContent = payload.params.caption || "";
  var head = document.getElementById("head");
  var body = document.getElementById("body");
  rows.forEach(function (cells, index) {
    var row = document.createElement("tr");
    cells.forEach(function (cell) {
      var element = document.createElement(index === 0 ? "th" : "td");
      if (index === 0) { element.setAttribute("scope", "col"); }
      element.textContent = cell;
      row.appendChild(element);
    });
    (index === 0 ? head : body).appendChild(row);
  });
})();
</script>
</body>
</html>
