<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta</title>
<style>
:root{--bg:var(--color-background,#ffffff);--fg:var(--color-text,#1a1a1a);--muted:#555555;--accent:#1f5fbf;--line:#cccccc}
@media (prefers-color-scheme: dark){:root{--bg:var(--color-background,#16181c);--fg:var(--color-text,#f0f0f0);--muted:#b8b8b8;--accent:#7fb0ff;--line:#444444}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
button{font:inherit;padding:8px 14px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.cue{font-size:1.5rem;font-weight:600;margin:8px 0 16px}
.hint{color:var(--muted)}
</style>
</head>
<body>
<main>
<p class="hint" id="task"></p>
<p class="cue" id="cue"></p>
<label for="answer" id="answer-label"></label>
<input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
<p><button type="button" id="check"></button></p>
<p role="status" id="result"></p>
</main>
<script type="application/json" id="tutor-params"></script>
<script>
(function () {
  // exact_text with pool_draw "one": the server sends drawn.cue and grades the text.
  var TEXT = {
    es: { task: "Escribe la traducción.", answer: "Tu respuesta", check: "Comprobar", right: "Correcto", wrong: "No es correcto" },
    en: { task: "Write the translation.", answer: "Your answer", check: "Check", right: "Right", wrong: "Not right" }
  };
  var payload = JSON.parse(document.getElementById("tutor-params").textContent);
  var t = TEXT[payload.ui_lang] || TEXT.es;
  document.getElementById("task").textContent = t.task;
  document.getElementById("answer-label").textContent = t.answer;
  document.getElementById("check").textContent = t.check;
  document.getElementById("cue").textContent = payload.drawn ? payload.drawn.cue : "";
  var input = document.getElementById("answer");
  var sent = false;
  function send() {
    var value = input.value.trim();
    if (!value || sent) { return; }
    sent = true;
    window.tutorSubmit({ answer_kind: "value", value: value });
  }
  document.getElementById("check").addEventListener("click", send);
  input.addEventListener("keydown", function (event) { if (event.key === "Enter") { send(); } });
  window.tutorOnResult = function (result) {
    document.getElementById("result").textContent = result.correct ? t.right : t.wrong;
  };
})();
</script>
</body>
</html>
