# General starter track, v0 draft (topics and general track spec, sections 4.1 and 4.2)
#
# Status: DRAFT for author review. Content only; the implementation plan turns it into a seed migration.
# Spec 4.2 places the final file at src/tutor/content/track_general_v0.yaml.
# Fields match the `track_items` and `track_chunks` tables in core spec section 5.
#
# Coverage (checked with a script before each commit; the plan turns it into a seed test):
#   - 24 items: gen-01..gen-12 are B1, gen-13..gen-24 are B2, ordered as a progression.
#   - 4 items per interaction type; no two consecutive items share a type.
#   - Every item has use_cases: [] (spec 4.1: the use-case rule does not apply to the general track).
#   - 5 items have skill = writing: gen-04, gen-07, gen-12, gen-17, gen-19.
#   - 5 chunks per item, each with one example sentence.
#   - No chunk text repeats a chunk text in track_it_v0.yaml.
#
# Topic-neutral (spec 4.2): the character is a role, not a place or a job; objective and obstacle
# name no setting; every scenario_hint ends with "Set it in today's topic." and the server picks the topic.
#
# Review checklist for the author:
#   1. Are the situations realistic for your testers' lives?
#   2. Is each chunk something a B1/B2 Mexican Spanish speaker would actually use (not textbook English)?
#   3. Is anything culturally odd for Mexican learners talking with English speakers?
#   4. Any interaction type missing or wrongly weighted?
#   5. Can every item be set in each of the seven non-tech topics without sounding forced?
#      (travel, daily life, work, studies, health, shopping and services, social life)
#
# Writing items: the learner writes; the character replies in writing with the obstacle.
# Chunk text has no slot markers ("...") so it can be matched against what the learner says.

domain: general
version: 1
items:
