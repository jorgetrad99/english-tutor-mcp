    order_no: 1
    cefr: B1
    skill: speaking
    interaction_type: small_talk
    use_cases: []
    can_do_en: "Can start a friendly conversation with someone I have just met and keep it going with simple questions."
    can_do_es: "Puedo iniciar una plática amable con alguien que acabo de conocer y mantenerla con preguntas sencillas."
    character: "a person you have just met who is friendly but a little shy"
    objective: "Start the conversation, find out two things about the other person and share two things about yourself."
    obstacle: "The other person gives very short answers at first, so you need a better question to get them talking."
    scenario_hint: "Two people meet for the first time while they wait for the same thing. Set it in today's topic."
    chunks:
      - {id: gen-01-c1, position: 1, text: "what brings you here", example: "So, what brings you here today?"}
      - {id: gen-01-c2, position: 2, text: "is this your first time", example: "Is this your first time here?"}
      - {id: gen-01-c3, position: 3, text: "how long have you been", example: "How long have you been waiting?"}
      - {id: gen-01-c4, position: 4, text: "same here", example: "Oh, really? Same here."}
      - {id: gen-01-c5, position: 5, text: "it was nice talking to you", example: "Well, it was nice talking to you."}

